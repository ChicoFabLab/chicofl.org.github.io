<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maker Radio - Digital Marquee</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background-color: #000000;
  }

  /* The container sets the stage */
  .signage-stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer; /* Indicates the screen is clickable/tappable */
  }

  /* Both flyer layers sit perfectly on top of each other */
  .flyer-layer {
    position: absolute;
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    
    /* Hardware-accelerated transitions for perfectly smooth motion */
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), 
                transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: opacity, transform;
  }

  /* --- TRANSITION STYLES --- */
  
  /* State 1: Active and visible */
  .active {
    opacity: 1;
    transform: scale(1);
    z-index: 2;
  }

  /* State 2: Hidden/Transitioned out (Cinematic Fade + Subtle Zoom Out) */
  .hidden {
    opacity: 0;
    transform: scale(0.95);
    z-index: 1;
  }
</style>
</head>
<body>

  <div class="signage-stage" id="stage">
    <img id="layerA" class="flyer-layer active" src="" alt="Signage Display" style="opacity: 0;">
    <img id="layerB" class="flyer-layer hidden" src="" alt="Signage Display">
  </div>

<script>
  // ==========================================
  // --- SIGNAGE PLAYLIST CONFIGURATION -------
  // ==========================================
  let flyerPlaylist = [];

  // How long each flyer stays on screen (20000ms = 20 seconds)
  const displayDuration = 20000; 
  // ==========================================

  let currentIndex = 0;
  const layerA = document.getElementById("layerA");
  const layerB = document.getElementById("layerB");
  const stage = document.getElementById("stage");
  
  let isLayerAActive = true;
  let rotationInterval = null;
  const cachedImages = [];
  
  // Track network validation tokens to verify backend modifications accurately
  let initialETag = null;
  let initialLastModified = null;

  // 1. DYNAMIC FILE DISCOVERY
  async function discoverFlyers() {
    const discovered = [];
    
    // Method 1: Try directory listing first (for servers with listing enabled)
    try {
      const response = await fetch('Marquee/', { cache: 'no-store' });
      if (response.ok) {
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('html')) {
          const text = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          const links = doc.querySelectorAll('a');
          
          links.forEach(link => {
            const href = link.getAttribute('href');
            if (href) {
              const decodedHref = decodeURIComponent(href);
              if (decodedHref.toLowerCase().endsWith('.png')) {
                const filename = decodedHref.split('/').pop();
                if (filename) {
                  discovered.push(`Marquee/${filename}`);
                }
              }
            }
          });
        }
      }
    } catch (e) {
      console.warn("Directory listing not supported or blocked, falling back to probing.", e);
    }

    // Method 2: Parallel probing (useful for static hosts like GitHub Pages where listing is disabled)
    try {
      const probePromises = [];
      const maxProbes = 50; 
      for (let i = 1; i <= maxProbes; i++) {
        const fileUrl = `Marquee/flyer_${i}.png`;
        probePromises.push(
          fetch(fileUrl, { method: 'HEAD', cache: 'no-store' })
            .then(res => res.ok ? fileUrl : null)
            .catch(() => null)
        );
      }
      const results = await Promise.all(probePromises);
      results.forEach(url => {
        if (url) discovered.push(url);
      });
    } catch (e) {
      console.error("Parallel probing failed:", e);
    }

    // Fallback: Default array if nothing was found
    if (discovered.length === 0) {
      return [
        "Marquee/flyer_1.png", 
        "Marquee/flyer_2.png",  
        "Marquee/flyer_3.png",
        "Marquee/flyer_4.png",
        "Marquee/flyer_5.png",
        "Marquee/flyer_6.png"
      ];
    }

    // Remove duplicates and sort them numerically or alphabetically
    return [...new Set(discovered)].sort((a, b) => {
      const numA = parseInt(a.replace(/\D/g, ''), 10);
      const numB = parseInt(b.replace(/\D/g, ''), 10);
      if (!isNaN(numA) && !isNaN(numB)) {
        return numA - numB;
      }
      return a.localeCompare(b);
    });
  }

  function arraysEqual(a, b) {
    if (a.length !== b.length) return false;
    for (let i = 0; i < a.length; i++) {
      if (a[i] !== b[i]) return false;
    }
    return true;
  }

  // 2. PRE-CACHING & HEADERS CAPTURE
  function preCacheImages() {
    flyerPlaylist.forEach((src) => {
      const img = new Image();
      img.src = src;
      cachedImages.push(img);
    });
  }
  
  async function captureInitialFileTokens() {
    try {
      const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
      initialETag = response.headers.get('ETag');
      initialLastModified = response.headers.get('Last-Modified');
    } catch (e) {
      console.error("Failed to capture initial file signatures", e);
    }
  }

  // 3. ROTATION LOGIC
  function rotateFlyers() {
    let loopResetOccurred = false;

    if (currentIndex === flyerPlaylist.length - 1) {
      currentIndex = 0;
      loopResetOccurred = true;
    } else {
      currentIndex++;
    }

    const nextImageSrc = flyerPlaylist[currentIndex];

    if (isLayerAActive) {
      layerB.src = nextImageSrc;
      setTimeout(() => {
        layerA.className = "flyer-layer hidden";
        layerB.className = "flyer-layer active";
      }, 50);
    } else {
      layerA.src = nextImageSrc;
      setTimeout(() => {
        layerB.className = "flyer-layer hidden";
        layerA.className = "flyer-layer active";
      }, 50);
    }

    isLayerAActive = !isLayerAActive;

    // Check for updates safely after the slide is long done transitioning
    if (loopResetOccurred) {
      setTimeout(async () => {
        // Compare list of files in directory
        const currentFiles = await discoverFlyers();
        if (!arraysEqual(currentFiles, flyerPlaylist)) {
          console.log("Playlist content changed on disk. Reloading...");
          location.reload();
          return;
        }

        // Compare html file token
        const updated = await checkForUpdates();
        if (updated) {
          console.log("Marquee.html has updated on disk. Reloading...");
          location.reload();
        }
      }, 3000); 
    }
  }

  // 4. RELIABLE UPDATE CHECK VIA HTTP HEADERS
  async function checkForUpdates() {
    try {
      const response = await fetch(window.location.href, { method: 'HEAD', cache: 'no-store' });
      if (!response.ok) return false;
      
      const newETag = response.headers.get('ETag');
      const newLastModified = response.headers.get('Last-Modified');
      
      if (initialETag && newETag && initialETag !== newETag) return true;
      if (initialLastModified && newLastModified && initialLastModified !== newLastModified) return true;
      
      return false;
    } catch (e) {
      console.error("Update check failed:", e);
      return false;
    }
  }

  // 5. TIMER MANAGEMENT
  function startTimer() {
    if (flyerPlaylist.length > 1) {
      rotationInterval = setInterval(rotateFlyers, displayDuration);
    } else {
      rotationInterval = setTimeout(() => { location.reload(); }, displayDuration);
    }
  }

  // 6. INITIALIZATION
  async function initSignage() {
    // Dynamically find available flyers
    flyerPlaylist = await discoverFlyers();
    
    if (flyerPlaylist.length > 0) {
      layerA.src = flyerPlaylist[0];
      // Reset transition opacity styling so it fades in nicely on initial load
      layerA.style.opacity = "";
    }

    await captureInitialFileTokens();
    preCacheImages();
    startTimer();

    // Interaction Event (Skip on Click)
    stage.addEventListener("click", () => {
      rotateFlyers();
      resetTimer();
    });
  }

  function resetTimer() {
    clearInterval(rotationInterval);
    clearTimeout(rotationInterval);
    startTimer();
  }

  // Kickoff on load
  initSignage();
</script>

</body>
</html>
